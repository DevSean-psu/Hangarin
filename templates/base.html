{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Hangarin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <nav class="sidebar d-flex flex-column">
            <div class="sidebar-brand">
                <i class="bi bi-check2-square"></i> Hangarin
            </div>
            <a href="{% url 'home' %}" class="active"><i class="bi bi-house-door"></i>Home</a>
            <a href="/admin/Tasks/task/"><i class="bi bi-list-task"></i>Tasks</a>
            <a href="/admin/Tasks/subtask/"><i class="bi bi-diagram-3"></i>SubTasks</a>
            <a href="/admin/Tasks/note/"><i class="bi bi-sticky"></i>Notes</a>
            <a href="/admin/Tasks/category/"><i class="bi bi-tags"></i>Categories</a>
            <a href="/admin/Tasks/priority/"><i class="bi bi-flag"></i>Priorities</a>
            <a href="/admin/" class="mt-auto"><i class="bi bi-gear"></i>Admin Panel</a>
        </nav>

        <div class="main flex-grow-1">
            <header class="topbar d-flex align-items-center justify-content-between">
                <h5 class="mb-0 fw-semibold">{% block page_title %}Dashboard{% endblock %}</h5>

                <div class="dropdown">
                    <button class="user-pill dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        <span class="user-avatar">G</span>
                        <span class="ms-2">Guest</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                        <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                        <li><a class="dropdown-item" href="#"><i class="bi bi-gear me-2"></i>Settings</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#"><i class="bi bi-box-arrow-right me-2"></i>Log out</a></li>
                    </ul>
                </div>
            </header>

            <div class="content-area">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/scripts.js' %}"></script>
</body>
</html>
