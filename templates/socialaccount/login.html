{% load i18n %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm Sign In - Hangarin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--sky) 0%, var(--sky-dark) 100%);
        }
        .auth-card {
            max-width: 420px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 2.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <h5 class="mb-3">Confirm Sign In</h5>
        <p class="text-muted mb-4">You are about to sign in using your <strong>{{ provider.name }}</strong> account.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary-sky w-100 mb-2">Continue with {{ provider.name }}</button>
        </form>
        <a href="{% url 'account_login' %}" class="btn btn-outline-secondary w-100">Cancel</a>
    </div>
</body>
</html>
