{% load socialaccount %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Hangarin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--sky) 0%, var(--sky-dark) 100%);
        }
        .auth-card {
            max-width: 440px;
            width: 100%;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 2.5rem;
        }
        .auth-brand {
            text-align: center;
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--sky-dark);
            margin-bottom: 1.5rem;
        }
        .social-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e5edf5;
            color: #1e293b;
            transition: background-color 0.15s ease;
        }
        .social-btn:hover {
            background-color: var(--sky-pale);
        }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-brand"><i class="bi bi-check2-square"></i> Hangarin</div>

        <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#pane-login" type="button">Login</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#pane-register" type="button">Register</button>
            </li>
        </ul>

        <div class="tab-content">
            <div class="tab-pane fade show active" id="pane-login">
                <form method="post" action="{% url 'account_login' %}">
                    {% csrf_token %}
                    <div class="text-center mb-3">
                        <p class="text-muted small mb-2">Sign in with:</p>
                        <a href="{% provider_login_url 'google' %}" class="social-btn mx-1"><i class="bi bi-google"></i></a>
                        <a href="{% provider_login_url 'github' %}" class="social-btn mx-1"><i class="bi bi-github"></i></a>
                    </div>
                    <p class="text-center text-muted small">or</p>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email or Username</label>
                        <input type="text" name="login" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>

                    {% if form.non_field_errors %}
                    <div class="alert alert-danger py-2 small">
                        {% for error in form.non_field_errors %}<p class="mb-0">{{ error }}</p>{% endfor %}
                    </div>
                    {% endif %}

                    <button type="submit" class="btn btn-primary-sky w-100 mt-2">Sign in</button>
                    <div class="text-center mt-3">
                        <a href="{% url 'account_reset_password' %}" class="small text-muted">Forgot password?</a>
                    </div>
                </form>
            </div>

            <div class="tab-pane fade" id="pane-register">
                <form method="post" action="{% url 'account_signup' %}">
                    {% csrf_token %}
                    <div class="text-center mb-3">
                        <p class="text-muted small mb-2">Sign up with:</p>
                        <a href="{% provider_login_url 'google' %}" class="social-btn mx-1"><i class="bi bi-google"></i></a>
                        <a href="{% provider_login_url 'github' %}" class="social-btn mx-1"><i class="bi bi-github"></i></a>
                    </div>
                    <p class="text-center text-muted small">or</p>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password1" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Repeat Password</label>
                        <input type="password" name="password2" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary-sky w-100 mt-2">Register</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
