{% extends "base.html" %}
{% block title %}Delete Task - Hangarin{% endblock %}
{% block page_title %}Delete Task{% endblock %}
{% block content %}

<div class="card-panel p-4" style="max-width: 500px;">
    <p>Are you sure you want to delete <strong>"{{ object }}"</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'task-list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
</div>

{% endblock %}
